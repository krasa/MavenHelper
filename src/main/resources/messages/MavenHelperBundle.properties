# GoalEditor - Lifecycle Goals
goal.lifecycle.clean.pre=execute processes needed prior to the actual project cleaning
goal.lifecycle.clean=remove all files generated by the previous build
goal.lifecycle.clean.post=execute processes needed to finalize the project cleaning
goal.lifecycle.default.validate=validate the project is correct and all necessary information is available.
goal.lifecycle.default.initialize=initialize build state, e.g. set properties or create directories.
goal.lifecycle.default.generate.sources=generate any source code for inclusion in compilation.
goal.lifecycle.default.process.sources=process the source code, for example to filter any values.
goal.lifecycle.default.generate.resources=generate resources for inclusion in the package.
goal.lifecycle.default.process.resources=copy and process the resources into the destination directory, ready for packaging.
goal.lifecycle.default.compile=compile the source code of the project.
goal.lifecycle.default.process.classes=post-process the generated files from compilation, for example to do bytecode enhancement on Java classes.
goal.lifecycle.default.generate.test.sources=generate any test source code for inclusion in compilation.
goal.lifecycle.default.process.test.sources=process the test source code, for example to filter any values.
goal.lifecycle.default.generate.test.resources=create resources for testing.
goal.lifecycle.default.process.test.resources=copy and process the resources into the test destination directory.
goal.lifecycle.default.test.compile=compile the test source code into the test destination directory
goal.lifecycle.default.process.test.classes=post-process the generated files from test compilation, for example to do bytecode enhancement on Java classes. For Maven 2.0.5 and above.
goal.lifecycle.default.test=run tests using a suitable unit testing framework. These tests should not require the code be packaged or deployed.
goal.lifecycle.default.prepare.package=perform any operations necessary to prepare a package before the actual packaging. This often results in an unpacked, processed version of the package. (Maven 2.1 and above)
goal.lifecycle.default.package=take the compiled code and package it in its distributable format, such as a JAR.
goal.lifecycle.default.pre.integration.test=perform actions required before integration tests are executed. This may involve things such as setting up the required environment.
goal.lifecycle.default.integration.test=process and deploy the package if necessary into an environment where integration tests can be run.
goal.lifecycle.default.post.integration.test=perform actions required after integration tests have been executed. This may including cleaning up the environment.
goal.lifecycle.default.verify=run any checks to verify the package is valid and meets quality criteria.
goal.lifecycle.default.install=install the package into the local repository, for use as a dependency in other projects locally.
goal.lifecycle.default.deploy=done in an integration or release environment, copies the final package to the remote repository for sharing with other developers and projects.
goal.lifecycle.site.pre=execute processes needed prior to the actual project site generation
goal.lifecycle.site=generate the project's site documentation
goal.lifecycle.site.post=execute processes needed to finalize the site generation, and to prepare for site deployment
goal.lifecycle.site.deploy=deploy the generated site documentation to the specified web server
